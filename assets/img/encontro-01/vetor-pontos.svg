<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -24 470 270" role="img" aria-label="Um vetor: três pontos ligados por uma reta e uma curva, com as linhas de direção da curva">
  <path d="M40 190 L150 60 C 200 0, 300 0, 360 170" fill="none" stroke="#1b4f7a" stroke-width="5"/>
  <g stroke="#b9501a" stroke-width="2" stroke-dasharray="6 4"><line x1="150" y1="60" x2="200" y2="0"/><line x1="360" y1="170" x2="300" y2="0"/></g>
  <g fill="#fff" stroke="#b9501a" stroke-width="2"><rect x="194" y="-6" width="12" height="12"/><rect x="294" y="-6" width="12" height="12"/></g>
  <g fill="#fff" stroke="#1d1c1a" stroke-width="3"><circle cx="40" cy="190" r="8"/><circle cx="150" cy="60" r="8"/><circle cx="360" cy="170" r="8"/></g>
  <g font-family="system-ui, sans-serif" font-size="15" fill="#1d1c1a">
    <text x="10" y="222">ponto (40, 190)</text>
    <text x="22" y="64">ponto (150, 60)</text>
    <text x="320" y="204">ponto (360, 170)</text>
    <text x="210" y="-10" fill="#b9501a">linhas de direção</text>
    <text x="104" y="140" fill="#1b4f7a">reta</text>
    <text x="262" y="80" fill="#1b4f7a">curva</text>
  </g>
</svg>
